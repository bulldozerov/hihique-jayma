[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hihique-requirements-validator"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["markdown-it-py==4.0.0", "google-genai>=2.34,<3", "httpx>=0.28,<1", "pydantic>=2,<3", "python-dotenv>=1,<2", "pypdf>=5,<7", "fastapi>=0.115,<1", "python-multipart>=0.0.18,<1", "uvicorn>=0.34,<1"]

[project.scripts]
parse-requirements = "validator.readers:main"
review-requirements = "validator.cli:main"

[tool.setuptools]
packages = ["validator"]
