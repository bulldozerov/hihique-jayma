[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hihique-requirements-validator"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["markdown-it-py==4.0.0"]

[project.scripts]
parse-requirements = "validator.readers:main"

[tool.setuptools]
packages = ["validator"]
