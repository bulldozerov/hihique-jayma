severity:
  critical: Блокирует реализацию или приёмку ключевого пользовательского сценария.
  major: Может привести к разной реализации или тестированию, но не блокирует ключевой сценарий целиком.
  minor: Локальный дефект формулировки с ограниченным влиянием.
rules:
  - id: L01
    pass: local
    kind: ambiguity
    criterion: Есть минимум два разумных толкования, которые меняют результат.
    example: Система хранит отчёт до конца недели. Начало недели и часовой пояс нигде не определены.
    counterexample: В глоссарии неделя определена как период с понедельника по воскресенье по UTC.
    required_evidence: Опорный блок и два толкования с разными результатами.
  - id: L02
    pass: local
    kind: unverifiable
    criterion: Из формулировки нельзя вывести наблюдаемый критерий успешного теста.
    example: Список товаров должен загружаться быстро.
    counterexample: Список отображается за 2 секунды после открытия экрана при указанном профиле нагрузки.
    required_evidence: Опорный блок и недостающий критерий проверки.
  - id: L03
    pass: local
    kind: incomplete
    criterion: У отдельно описанного правила явно указано условие, но отсутствует необходимая часть поведения.
    example: При истечении срока брони система должна обработать запись.
    counterexample: При истечении срока брони система переводит её в статус EXPIRED.
    required_evidence: Опорный блок и отсутствующее действие, входное условие или ожидаемый результат.
  - id: L04
    pass: local
    kind: design_constraint
    criterion: Требование навязывает способ реализации без указанной цели или ограничений совместимости.
    example: Экран каталога должен использовать конкретную библиотеку сортировки без причины в спецификации.
    counterexample: Формат экспорта выбран для совместимости с указанной системой-получателем.
    required_evidence: Опорный блок, навязанное решение и его отличие от требуемого результата.
  - id: S01
    pass: document
    kind: contradiction
    criterion: Два положения применимы к одному сценарию и предписывают несовместимые результаты.
    example: После отмены брони слот освобождается сразу, но для той же отмены таблица приёмки требует удерживать слот до полуночи.
    counterexample: Немедленное освобождение относится к бесплатным броням, удержание до полуночи — к оплаченным.
    required_evidence: Две дословные цитаты в порядке указанных блоков и конкретный сценарий расхождения.
  - id: S02
    pass: document
    kind: gap
    criterion: При сопоставлении связанных правил обнаруживается необходимый сценарий, который ни одно правило не покрывает.
    example: Импорт создаёт бронь, отмена освобождает слот, но при повторном импорте уже отменённой записи поведение нигде не задано.
    counterexample: Правила импорта явно игнорируют повторный импорт отменённой записи.
    required_evidence: Блоки с контекстом и конкретный отсутствующий сценарий.
  - id: S03
    pass: document
    kind: duplication
    criterion: Одно нормативное правило независимо задано в нескольких местах без указания основного источника.
    example: Два раздела независимо задают один и тот же срок хранения архива для одной роли.
    counterexample: Критерий приёмки проверяет срок хранения, указанный в бизнес-правиле.
    required_evidence: Два разных блока и объяснение, какое обязательство продублировано.
